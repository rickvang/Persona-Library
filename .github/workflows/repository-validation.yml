name: Repository validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: repository-validation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install pinned build dependencies
        run: npm ci --include=dev --ignore-scripts --no-fund --no-audit

      - name: Build generated library output
        run: node scripts/build-library.mjs

      - name: Validate authored and generated content
        run: node scripts/validate-content.mjs

      - name: Benchmark graph-backed activation timing
        run: node eval/agent-context-timing-benchmark.mjs --json --warmup=30 --iterations=250

      - name: Run repository validation tests
        run: node --test scripts/validation/validation.test.mjs scripts/validation/vercel-git-deployment.test.mjs scripts/validation/seen-job-store.test.mjs scripts/validation/recipe-comparison.test.mjs scripts/validation/token-usage.test.mjs scripts/validation/allowance-usage.test.mjs scripts/validation/routing-paths.test.mjs scripts/validation/placement-gate.test.mjs scripts/validation/generated-output-cleanliness.test.mjs scripts/validation/activation-footprint.test.mjs scripts/validation/work-order-lifecycle.test.mjs scripts/validation/historical-docs.test.mjs scripts/validation/skill-identity-normalization.test.mjs scripts/validation/human-orientation-boundary.test.mjs scripts/validation/site-human-ia.test.mjs scripts/validation/system-map.test.mjs scripts/validation/persona-skill-system-map.test.mjs scripts/validation/technical-system-map.test.mjs scripts/validation/system-map-context-experiment.test.mjs scripts/validation/agent-context-bundle.test.mjs scripts/validation/template-composition-bundle.test.mjs scripts/validation/tool-resolution-bundle.test.mjs scripts/validation/skill-package-maintenance-bundle.test.mjs scripts/validation/system-orientation-behavior.test.mjs scripts/validation/template-composition-migration.test.mjs scripts/validation/tool-resolution-migration.test.mjs scripts/validation/skill-package-maintenance-migration.test.mjs scripts/validation/agent-context-timing-benchmark.test.mjs scripts/validation/agent-context-consolidation.test.mjs scripts/validation/archive-search-boundary.test.mjs

      - name: Validate source-driven Tools publication
        run: node --test scripts/validation/tool-publication.test.mjs

      - name: Validate native application-packet execution
        run: node --test scripts/validation/application-packet.test.mjs

      - name: Validate source-driven Playbooks and Docs publication
        run: node --test scripts/validation/reference-publication.test.mjs

      - name: Protect Phase 9 canonical routing control
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/phase-9-agent-context-experiment'
        run: |
          changed="$(git diff --name-only "${{ github.event.pull_request.base.sha }}...HEAD" -- AGENTS.md content/site-orientation.json content/orientation/)"
          if [ -n "$changed" ]; then
            echo "Phase 9 must not mutate canonical activation/routing files:"
            echo "$changed"
            exit 1
          fi

      - name: Validate graph-backed agent context bundles
        run: node scripts/build-agent-context-bundles.mjs --check

      - name: Validate system-orientation migration report
        run: node eval/system-orientation-migration.mjs --check

      - name: Validate system-orientation behavioral parity report
        run: node eval/system-orientation-behavior.mjs --check

      - name: Validate Template composition migration report
        run: node eval/template-composition-migration.mjs --check

      - name: Validate Template composition behavioral parity report
        run: node eval/template-composition-behavior.mjs --check

      - name: Validate Tool resolution migration report
        run: node eval/tool-resolution-migration.mjs --check

      - name: Validate Tool resolution behavioral parity report
        run: node eval/tool-resolution-behavior.mjs --check

      - name: Validate Skill package maintenance migration report
        run: node eval/skill-package-maintenance-migration.mjs --check

      - name: Validate Skill package maintenance behavioral parity report
        run: node eval/skill-package-maintenance-behavior.mjs --check

      - name: Validate Phase E consolidation report
        run: node eval/agent-context-consolidation.mjs --check

      - name: Protect Phase A canonical route records
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/issue-243-system-orientation-migration'
        run: |
          changed="$(git diff --name-only "${{ github.event.pull_request.base.sha }}...HEAD" -- content/site-orientation.json content/orientation/)"
          if [ -n "$changed" ]; then
            echo "Phase A must not mutate canonical bootstrap or route-group records:"
            echo "$changed"
            exit 1
          fi

      - name: Protect Phase B canonical route records
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/issue-245-system-orientation-behavior'
        run: |
          changed="$(git diff --name-only "${{ github.event.pull_request.base.sha }}...HEAD" -- content/site-orientation.json content/orientation/)"
          if [ -n "$changed" ]; then
            echo "Phase B must not mutate canonical bootstrap or route-group records:"
            echo "$changed"
            exit 1
          fi

      - name: Protect Phase C canonical route records
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/issue-247-template-composition-migration'
        run: |
          changed="$(git diff --name-only "${{ github.event.pull_request.base.sha }}...HEAD" -- content/site-orientation.json content/orientation/)"
          if [ -n "$changed" ]; then
            echo "Phase C must not mutate canonical bootstrap or route-group records:"
            echo "$changed"
            exit 1
          fi

      - name: Protect Phase D canonical route records
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/issue-249-tool-resolution-migration'
        run: |
          changed="$(git diff --name-only "${{ github.event.pull_request.base.sha }}...HEAD" -- content/site-orientation.json content/orientation/)"
          if [ -n "$changed" ]; then
            echo "Phase D must not mutate canonical bootstrap or route-group records:"
            echo "$changed"
            exit 1
          fi

      - name: Protect Phase E canonical route records
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/issue-251-phase-e-consolidation'
        run: |
          changed="$(git diff --name-only "${{ github.event.pull_request.base.sha }}...HEAD" -- content/site-orientation.json content/orientation/)"
          if [ -n "$changed" ]; then
            echo "Phase E must not mutate canonical bootstrap or route-group records:"
            echo "$changed"
            exit 1
          fi

      - name: Protect issue #253 canonical route records
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/issue-253-skill-package-context'
        run: |
          changed="$(git diff --name-only "${{ github.event.pull_request.base.sha }}...HEAD" -- content/site-orientation.json content/orientation/)"
          if [ -n "$changed" ]; then
            echo "Issue #253 must not mutate canonical bootstrap or route-group records:"
            echo "$changed"
            exit 1
          fi

      - name: Check committed whitespace for pull request
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"

      - name: Check committed whitespace for main push
        if: github.event_name == 'push'
        run: git diff --check "${{ github.event.before }}..${{ github.sha }}"

      - name: Verify generated output is committed
        run: node scripts/check-generated-output.mjs
