name: Reconcile issue 117 decision history

on:
  push:
    branches:
      - fix/issue-117-decision-history-fidelity

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-117-decision-history-fidelity
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore lossless pre-112 Decision snapshots
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          from html.parser import HTMLParser
          from pathlib import Path

          SOURCE_REF = '8f77c24ec63f063a801943fc6d5d4f3009b666c7'
          html = subprocess.check_output(
              ['git', 'show', f'{SOURCE_REF}:dist/decisions.html'],
              text=True,
          )

          class DecisionParser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.records = {}
                  self.current = None
                  self.in_meta = False
                  self.capture = None
                  self.buffer = []
                  self.current_line = None

              @staticmethod
              def classes(attrs):
                  value = dict(attrs).get('class', '')
                  return set(value.split())

              def start_capture(self, name):
                  self.capture = name
                  self.buffer = []

              def finish_capture(self):
                  value = ''.join(self.buffer).strip()
                  name = self.capture
                  self.capture = None
                  self.buffer = []
                  return name, value

              def handle_starttag(self, tag, attrs):
                  attrs_dict = dict(attrs)
                  classes = self.classes(attrs)
                  if tag == 'article' and 'decision-record' in classes:
                      self.current = {
                          'article_id': attrs_dict.get('id'),
                          'meta': [],
                          'title': '',
                          'summary': '',
                          'lines': [],
                      }
                      return
                  if not self.current:
                      return
                  if tag == 'div' and 'record-meta' in classes:
                      self.in_meta = True
                  elif tag == 'span' and self.in_meta and 'label' in classes:
                      self.start_capture('meta')
                  elif tag == 'h3':
                      self.start_capture('title')
                  elif tag == 'p' and 'record-summary' in classes:
                      self.start_capture('summary')
                  elif tag == 'div' and 'record-line' in classes:
                      self.current_line = {'label': '', 'value': ''}
                  elif self.current_line is not None and tag == 'strong':
                      self.start_capture('line_label')
                  elif self.current_line is not None and tag == 'span':
                      self.start_capture('line_value')
                  elif tag == 'code' and self.capture == 'line_value':
                      self.buffer.append('`')

              def handle_endtag(self, tag):
                  if not self.current:
                      return
                  if tag == 'code' and self.capture == 'line_value':
                      self.buffer.append('`')
                  if self.capture == 'meta' and tag == 'span':
                      _, value = self.finish_capture()
                      self.current['meta'].append(value)
                  elif self.capture == 'title' and tag == 'h3':
                      _, value = self.finish_capture()
                      self.current['title'] = value
                  elif self.capture == 'summary' and tag == 'p':
                      _, value = self.finish_capture()
                      self.current['summary'] = value
                  elif self.capture == 'line_label' and tag == 'strong':
                      _, value = self.finish_capture()
                      self.current_line['label'] = value
                  elif self.capture == 'line_value' and tag == 'span':
                      _, value = self.finish_capture()
                      self.current_line['value'] = value
                  if tag == 'div' and self.current_line is not None and self.current_line['label'] and self.current_line['value']:
                      self.current['lines'].append(self.current_line)
                      self.current_line = None
                  if tag == 'div' and self.in_meta:
                      self.in_meta = False
                  if tag == 'article':
                      record_id = None
                      if self.current['article_id'] == 'dec-document-evidence-quality':
                          record_id = 'DEC-DOCUMENT-EVIDENCE-QUALITY'
                      else:
                          record_id = next((item for item in self.current['meta'] if item.startswith('DEC-')), None)
                      if not record_id:
                          raise SystemExit(f'Could not resolve historical Decision ID for {self.current}')
                      self.records[record_id] = self.current
                      self.current = None

              def handle_data(self, data):
                  if self.capture:
                      self.buffer.append(data)

          parser = DecisionParser()
          parser.feed(html)

          source_path = Path('docs/decisions/records.json')
          source = json.loads(source_path.read_text(encoding='utf-8'))
          expected = ['DEC-DOCUMENT-EVIDENCE-QUALITY'] + [f'DEC-{i:03d}' for i in range(1, 13)]
          missing_history = [record_id for record_id in expected if record_id not in parser.records]
          if missing_history:
              raise SystemExit(f'Missing historical records: {missing_history}')

          current_by_id = {record['id']: record for record in source['records']}
          missing_current = [record_id for record_id in expected if record_id not in current_by_id]
          if missing_current:
              raise SystemExit(f'Missing current records: {missing_current}')

          for record_id in expected:
              old = parser.records[record_id]
              current_by_id[record_id]['historical'] = {
                  'source_ref': SOURCE_REF,
                  'title': old['title'],
                  'summary': old['summary'],
                  'lines': old['lines'],
              }

          # Focused fidelity assertions for the known migration losses.
          def line_value(record_id, label):
              lines = current_by_id[record_id]['historical']['lines']
              return next((line['value'] for line in lines if line['label'] == label), '')

          for record_id in ['DEC-003', 'DEC-004', 'DEC-005', 'DEC-006']:
              labels = [line['label'] for line in current_by_id[record_id]['historical']['lines']]
              if 'Why parked' not in labels or 'Notes' not in labels:
                  raise SystemExit(f'{record_id} did not preserve legacy parked labels')

          if 'A scoped Persona–Skill–workflow application keeps applicability contextual.' not in line_value('DEC-008', 'Rationale'):
              raise SystemExit('DEC-008 scoped applicability sentence missing')
          if 'project-specific starters remain local until evidence supports promotion.' not in line_value('DEC-008', 'Tradeoffs'):
              raise SystemExit('DEC-008 local starter tradeoff missing')
          if 'three initial design-system identities remain planned' not in line_value('DEC-008', 'Affects'):
              raise SystemExit('DEC-008 design-system historical note missing')
          if 'architecture, taxonomy, and concept-boundary questions.' not in line_value('DEC-009', 'Affects'):
              raise SystemExit('DEC-009 taxonomy escalation missing')
          if 'Template Skills and Librarian identity remain unchanged.' not in line_value('DEC-012', 'Affects'):
              raise SystemExit('DEC-012 role-boundary wording missing')
          if 'Numbered DEC-012 after DEC-011 on the Riley/job-search ownership boundary.' not in line_value('DEC-012', 'Affects'):
              raise SystemExit('DEC-012 historical numbering note missing')
          if not line_value('DEC-011', 'Decision').startswith('Playbook owns the outcome.'):
              raise SystemExit('DEC-011 historical Decision wording changed')

          source_path.write_text(json.dumps(source, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Rebuild generated output
        run: node scripts/build-library.mjs
      - name: Validate repository and historical rendering
        shell: bash
        run: |
          node scripts/validate-content.mjs
          node --test scripts/validation/validation.test.mjs
          node eval/isolated-persona-skill.mjs validate
          node --check scripts/build-decisions.mjs
          git diff --check
          grep -F '<strong>Why parked</strong>' dist/decisions.html
          grep -F '<strong>Notes</strong>' dist/decisions.html
          grep -F 'A scoped Persona–Skill–workflow application keeps applicability contextual.' dist/decisions.html
          grep -F 'project-specific starters remain local until evidence supports promotion.' dist/decisions.html
          grep -F 'architecture, taxonomy, and concept-boundary questions.' dist/decisions.html
          grep -F 'Template Skills and Librarian identity remain unchanged. Numbered DEC-012 after DEC-011 on the Riley/job-search ownership boundary.' dist/decisions.html
          grep -F 'Riley is the default routing front door' dist/decisions.html
          grep -F 'Personas operate Playbooks; job search gets a domain orchestrator' dist/decisions.html
      - name: Finalize Work Order
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('docs/work-orders/WO-2026-09-16-decision-history-fidelity/work-order.md')
          text = path.read_text(encoding='utf-8')
          text = text.replace('- Status: active', '- Status: ready-for-review')
          text = text.replace('## Current phase\n\nImplementation.\n\n## Next action\n\nAdd lossless historical-display metadata to migrated Decision records, update the renderer and validation, rebuild generated output, then open a focused PR for review.\n', '''## Current phase\n\nReady for review.\n\n## Validation\n\nPassed on GitHub Actions:\n\n- `node scripts/build-library.mjs`\n- `node scripts/validate-content.mjs`\n- `node --test scripts/validation/validation.test.mjs`\n- `node eval/isolated-persona-skill.mjs validate`\n- `node --check scripts/build-decisions.mjs`\n- `git diff --check`\n- focused generated-output checks for parked labels, DEC-008/009/012 restored wording, DEC-011 historical wording, and DEC-013/014 preservation\n\n## Reconciliation\n\nRequired: canonical Decision source, Decisions renderer, generated Decisions output, and this Work Order. Unchanged: Riley/Priya routing, Playbook/operator semantics, Persona/Skill records, job-search contracts, and later Decision conclusions.\n\n## Next action\n\nOpen one focused PR for independent review. Merge remains separately authorized.\n''')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit reconciled result and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/issue-117-history-fidelity.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Preserve historical Decision text (#117)"
          git push origin HEAD:fix/issue-117-decision-history-fidelity
