name: Issue 113 implementation build

on:
  push:
    branches:
      - issue-113-persona-operated-playbooks

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: issue-113-persona-operated-playbooks
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply guarded issue 113 changes
        run: node scripts/issue-113-apply.mjs apply

      - name: Rebuild generated library data
        run: node scripts/build-library.mjs

      - name: Validate implementation
        run: node scripts/validate-content.mjs

      - name: Finalize Work Order evidence
        run: node scripts/issue-113-apply.mjs finalize

      - name: Revalidate finalized branch
        run: node scripts/validate-content.mjs

      - name: Commit implementation results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: implement persona-operated job search playbook"
          git push origin HEAD:issue-113-persona-operated-playbooks
