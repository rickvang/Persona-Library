name: PR 114 reconcile with current main

on:
  push:
    branches:
      - issue-113-persona-operated-playbooks

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-113-persona-operated-playbooks
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Merge current main and resolve expected conflicts
        run: |
          set -euo pipefail
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e
          conflicts="$(git diff --name-only --diff-filter=U || true)"
          if [ -n "$conflicts" ]; then
            echo "Conflicts:"
            echo "$conflicts"
            while IFS= read -r path; do
              case "$path" in
                ARCHITECTURE.md|content/orientation/docs.json|dist/data/library-data.js|dist/data/orientation/docs.json|dist/decisions.html|docs/job-search/implementation.md|scripts/validation/generated.mjs)
                  git checkout --theirs -- "$path"
                  git add "$path"
                  ;;
                *)
                  echo "Unexpected conflict: $path" >&2
                  exit 1
                  ;;
              esac
            done <<< "$conflicts"
          elif [ "$merge_status" -ne 0 ]; then
            echo "Merge failed without reported file conflicts" >&2
            exit 1
          fi
      - name: Apply #112/#114 architecture reconciliation
        run: |
          node scripts/issue-114-reconcile.mjs apply
          sed -i "s/jobSearchImpl.includes('AI orchestrator (Riley Morgan)')/jobSearchImpl.includes('Riley Morgan · AI orchestrator')/g" scripts/validation/generated.mjs
      - name: Rebuild generated outputs
        run: node scripts/build-library.mjs
      - name: Validate reconciled branch
        run: |
          node scripts/validate-content.mjs
          node --test scripts/validation/validation.test.mjs
          node eval/isolated-persona-skill.mjs validate
          git diff --check
      - name: Finalize Work Order evidence
        run: |
          node scripts/issue-114-reconcile.mjs finalize
          node scripts/build-library.mjs
          node scripts/validate-content.mjs
          node --test scripts/validation/validation.test.mjs
          git diff --check
      - name: Commit reconciled result
        run: |
          rm -f .github/workflows/pr-114-reconcile.yml scripts/issue-114-reconcile.mjs
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --quiet && exit 0
          git commit -m "Reconcile PR #114 with orchestrator-first routing"
          git push origin HEAD:issue-113-persona-operated-playbooks
