name: Issue 113 final validation

on:
  push:
    branches:
      - issue-113-persona-operated-playbooks

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-113-persona-operated-playbooks
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply final ontology correction
        run: node scripts/issue-113-final-fix.mjs
      - name: Rebuild generated data
        run: node scripts/build-library.mjs
      - name: Run repository validation
        run: node scripts/validate-content.mjs
      - name: Commit validated correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix: reject playbook-as-owner job search wording"
          git push origin HEAD:issue-113-persona-operated-playbooks
