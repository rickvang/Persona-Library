name: Reconcile issue 96 seen-job deduplication

on:
  push:
    branches: ["fix/issue-96-seen-job-dedup"]

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-96-seen-job-dedup
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply scoped reconciliation
        run: python3 .github/issue96_reconcile.py
      - name: Rebuild generated outputs
        run: node scripts/build-library.mjs
      - name: Validate
        run: |
          node scripts/validate-content.mjs
          node --test scripts/validation/validation.test.mjs
          node eval/isolated-persona-skill.mjs validate
          git diff --check
      - name: Commit result and remove temporary helpers
        run: |
          rm -f .github/workflows/issue-96-reconcile.yml .github/issue96_reconcile.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Reconcile seen-job deduplication scope (#96)"
          git push origin HEAD:fix/issue-96-seen-job-dedup
